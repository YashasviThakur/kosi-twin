AWSTemplateFormatVersion: "2010-09-09"
Description: Kosi Twin — Kosi flood model API (Lambda + API Gateway) and site/layers (S3) behind one CloudFront domain.

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  SiteUrl:
    Type: String
    Default: ""
    Description: The site's own https URL, used for the links in alert emails. deploy.sh passes the stack's current CloudFront URL.

Resources:
  # ---------- storage ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kosi-twin-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------- crowd reports (embankment leaks, cracks, breaches) ----------
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kosi-twin-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: id, KeyType: RANGE }

  # ---------- village flood alerts by email ----------
  # One topic; each address is a subscription filtered to the villages it follows (see backend/kosi/alerts.py). SNS emails a
  # confirmation link before anything else and adds an unsubscribe link to every message.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kosi-twin-alerts
      DisplayName: Kosi Twin alerts

  # ---------- API ----------
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: kosi-twin-ai
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [polly:SynthesizeSpeech, translate:TranslateText, rekognition:DetectLabels, rekognition:DetectFaces]
                Resource: "*"
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt ReportsTable.Arn
              - Effect: Allow
                Action: [sns:Subscribe, sns:Publish, sns:SetSubscriptionAttributes, sns:GetSubscriptionAttributes]
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${SiteBucket.Arn}/audio/*

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kosi-twin-api
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: kosi.api.handler
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 1536
      Timeout: 29
      Environment:
        Variables:
          KOSI_DATA_DIR: /var/task/model
          KOSI_BUCKET: !Ref SiteBucket
          KOSI_LAYER_BASE_URL: /layers
          KOSI_REPORTS_TABLE: !Ref ReportsTable
          KOSI_ALERT_TOPIC: !Ref AlertTopic
          KOSI_SITE_URL: !Ref SiteUrl

  # Every 5 minutes: keeps the function warm and the live barrage reading fresh (see handler in kosi/api.py).
  WarmRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - { Arn: !GetAtt ApiFunction.Arn, Id: warm }

  WarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmRule.Arn

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: kosi-twin
      ProtocolType: HTTP
      Target: !GetAtt ApiFunction.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # ---------- CDN ----------
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub kosi-twin-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Kosi Twin
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            Compress: true
          - PathPattern: /layers/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}

Outputs:
  Url:
    Value: !Sub https://${Cdn.DomainName}
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Cdn
