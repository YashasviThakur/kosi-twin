name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npm run test:sw
      - run: npm run build

  backend:
    # The backend tests (backend/tests) need the model artifacts in backend/data/out, which are generated by backend/prep and are not
    # committed. CI therefore checks that the runtime package installs and compiles; run `python -m pytest` locally after building the model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/kosi
      - run: python -c "import sys; sys.path.insert(0, 'backend'); import kosi.modelcheck, kosi.alerts" 
        env:
          KOSI_AWS: "0"
